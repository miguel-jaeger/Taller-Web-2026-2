<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Estructura básica de una tabla</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 1: Estructura básica de una tabla</h1>
        <p class="consigna">Una tabla de 2 filas y 3 columnas con borde de 1 píxel: nombres de tres productos y sus precios.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <tr>
                    <td>Laptop</td>
                    <td>Mouse</td>
                    <td>Teclado</td>
                </tr>
                <tr>
                    <td>S/ 2500</td>
                    <td>S/ 50</td>
                    <td>S/ 120</td>
                </tr>
            </table>

        </section>

    </main>
</body>
</html>
