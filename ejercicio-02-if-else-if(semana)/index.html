<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 · if / else if / else</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicio 2: Evaluación múltiple con <code>if / else if / else</code></h1>
        <p class="consigna">
            Ingresa el dia de la semana(1-7).
        </p>
    </header>

    <form id="form-puntuacion">
        <div class="campo">
            <label for="puntuacion">Día</label>
            <input type="number" id="dia" name="dia" value="3" min="0" max="20" required>
        </div>
        <button type="submit">Mostrar día</button>
    </form>

    <p class="nota">
        Abre la consola del navegador (<code>F12</code> → pestaña «Consola») para ver el resultado.
    </p>

    <script src="script.js"></script>
</body>
</html>
