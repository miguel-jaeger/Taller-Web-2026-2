<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Uso de JavaScript interno</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 1: Uso de JavaScript interno</h1>
        <p class="consigna">Un documento HTML con un script interno que muestra una alerta con el texto «¡Esto es una alerta!» al cargar la página.</p>
    </header>
    <main>
        <section class="demo">
            <p>La alerta se ejecuta desde un bloque <code>&lt;script&gt;</code> interno.</p>

        </section>

    </main>
    <script>
        alert("¡Esto es una alerta!");
    </script>
</body>
</html>
