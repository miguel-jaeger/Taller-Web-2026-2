<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6: Estructuración semántica con thead, tbody y tfoot</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 6: Estructuración semántica con thead, tbody y tfoot</h1>
        <p class="consigna">Una tabla financiera organizada en bloque de encabezado, bloque de datos y bloque de resumen final.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Monto (S/)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ingresos por Matrícula</td>
                        <td>5400.00</td>
                    </tr>
                    <tr>
                        <td>Venta de Libros</td>
                        <td>1200.00</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th>Total General</th>
                        <td>6600.00</td>
                    </tr>
                </tfoot>
            </table>

        </section>

    </main>
</body>
</html>
