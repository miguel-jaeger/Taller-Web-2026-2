<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Formulario con atributos action y method</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 1: Formulario con atributos action y method</h1>
        <p class="consigna">Un formulario que procesa sus datos con <code>contacto.php</code> y los envía mediante el método <code>post</code>.</p>
    </header>
    <main>
        <div class="demo">
            <form action="contacto.php" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
                <br><br>
                <input type="submit" value="Enviar">
            </form>
        </div>

    </main>
</body>
</html>
