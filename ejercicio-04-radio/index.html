<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Botones de opción excluyentes</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 4: Botones de opción excluyentes</h1>
        <p class="consigna">Un grupo de botones <code>radio</code> con el mismo atributo <code>name</code> para que solo pueda marcarse una opción.</p>
    </header>
    <main>
        <div class="demo">
            <form>
                <p>Género:</p>
                <label><input type="radio" name="genero" value="masculino"> Masculino</label><br>
                <label><input type="radio" name="genero" value="femenino"> Femenino</label>
            </form>
        </div>

    </main>
</body>
