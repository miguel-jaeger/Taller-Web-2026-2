<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10: Galería Flexbox con imágenes adaptables</title>
    <link rel="stylesheet" href="../assets/estilos.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 10: Galería Flexbox con imágenes adaptables</h1>
        <p class="consigna">Una galería de tres imágenes en línea con Flexbox, separación de 20 píxeles, <code>flex-wrap</code> e imágenes cuadradas recortadas proporcionalmente.</p>
    </header>
    <main>
        <section class="demo">
            <div class="galeria">
                <img src="https://picsum.photos/400/300?random=101" alt="Soleado">
                <img src="https://picsum.photos/400/300?random=102" alt="Montaña">
                <img src="https://picsum.photos/400/300?random=103" alt="Catarata">
            </div>

        </section>

    </main>
</body>
</html>
