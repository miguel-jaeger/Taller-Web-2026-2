<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjeta Interactiva</title>
  <link rel="stylesheet" href="style.css">
 
</head>
<body>

  <!-- Tarjeta -->
  <div class="tarjeta">
    
    <!-- Contenedor con overflow:hidden para la imagen -->
    <div class="contenedor-imagen">
      <img src="img/corazon.webp" alt="Producto">
    </div>

    <!-- Contenido y Botón -->
    <div class="contenido">
      <h2>Producto Genial</h2>
      <p>Aprende animaciones y transiciones básicas en CSS.</p>
      <button class="boton-compra">Comprar</button>
    </div>

  </div>

</body>
</html>
