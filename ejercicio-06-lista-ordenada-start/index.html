<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6: Lista ordenada con numeración personalizada</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 6: Lista ordenada con numeración personalizada</h1>
        <p class="consigna">Una lista ordenada de cuatro nombres que comienza a contar desde el número 7 usando el atributo <code>start</code>.</p>
    </header>
    <main>
        <div class="demo">
            <p>Uso del atributo <code>start</code></p>
            <ol start="7">
                <li>Julio</li>
                <li>Carmen</li>
                <li>Pedro</li>
                <li>Sofía</li>
            </ol>
        </div>

    </main>
</body>
</html>
