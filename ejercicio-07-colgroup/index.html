<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7: Agrupación de columnas con colgroup</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 7: Agrupación de columnas con colgroup</h1>
        <p class="consigna">Una tabla de tres columnas que usa <code>&lt;colgroup&gt;</code> para colorear la primera columna y las dos siguientes con <code>span="2"</code>.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <colgroup span="1" style="background: lightgray;"></colgroup>
                <colgroup span="2" style="background: lightblue;"></colgroup>
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                </tr>
                <tr>
                    <td>01</td>
                    <td>Memoria RAM 16GB</td>
                    <td>Hardware</td>
                </tr>
            </table>

        </section>

    </main>
</body>
</html>
