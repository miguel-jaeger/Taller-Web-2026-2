<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Declaración de variables y concatenación</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 4: Declaración de variables y concatenación</h1>
        <p class="consigna">Dos variables con <code>let</code>: <code>nombre</code> = «Juan» y <code>edad</code> = 20. Se muestra «Hola, Juan» y «Tu edad es: 20» con <code>document.write()</code>.</p>
    </header>
    <main>
        <section class="demo">
            <script>
                let nombre = "Juan";
                let edad = 20;
                document.write("Hola, " + nombre + "<br>");
                document.write("Tu edad es: " + edad + "<br>");
            </script>

        </section>

    </main>
</body>
</html>
