<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6: Manipulación de cadenas de texto</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 6: Manipulación de cadenas de texto</h1>
        <p class="consigna">Se usa una variable <code>texto</code> con «Hola Mundo» y se muestran el texto en mayúsculas y la cantidad total de caracteres.</p>
    </header>
    <main>
        <section class="demo">
            <script>
                let texto = "Hola Mundo";
                document.write("Mayúsculas: " + texto.toUpperCase() + "<br>");
                document.write("Cantidad de caracteres: " + texto.length + "<br>");
            </script>

        </section>

    </main>
</body>
</html>
