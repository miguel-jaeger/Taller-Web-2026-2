<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9: Notificaciones dinámicas</title>
    <link rel="stylesheet" href="../assets/estilos.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 9: Notificaciones dinámicas</h1>
        <p class="consigna">Tres botones generan notificaciones de éxito, error e información. Cada notificación aparece, se apila y desaparece automáticamente.</p>
    </header>
    <main>
        <section class="demo">
            <div class="botones">
                <button type="button" data-tipo="exito" data-mensaje="Operación realizada correctamente.">Mostrar éxito</button>
                <button type="button" data-tipo="error" data-mensaje="Ocurrió un error al procesar la solicitud.">Mostrar error</button>
                <button type="button" data-tipo="info" data-mensaje="Este es un mensaje informativo.">Mostrar información</button>
            </div>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
