<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Fusión de columnas horizontales</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 3: Fusión de columnas horizontales</h1>
        <p class="consigna">Una tabla de ventas de tres columnas; en la última fila se combinan las dos primeras con <code>colspan</code>.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                </tr>
                <tr>
                    <td>Monitor</td>
                    <td>1</td>
                    <td>S/ 380.00</td>
                </tr>
                <tr>
                    <th colspan="2">Total a Pagar</th>
                    <td>S/ 380.00</td>
                </tr>
            </table>

        </section>

    </main>
</body>
</html>
