<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7: Lista ordenada invertida con letras mayúsculas</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 7: Lista ordenada invertida con letras mayúsculas</h1>
        <p class="consigna">Una lista ordenada con letras mayúsculas (<code>type="A"</code>) y numeración descendente mediante el atributo <code>reversed</code>.</p>
    </header>
    <main>
        <div class="demo">
            <ol type="A" reversed>
                <li>Julio</li>
                <li>Carmen</li>
                <li>Pedro</li>
                <li>Sofía</li>
            </ol>
        </div>

    </main>
</body>
