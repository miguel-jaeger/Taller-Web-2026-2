<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5: Formulario de búsqueda en cabecera</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 5: Formulario de búsqueda en cabecera</h1>
        <p class="consigna">Un buscador dentro del <code>&lt;header&gt;</code> con un campo de texto etiquetado «Buscar:» y un botón de tipo <code>submit</code>.</p>
    </header>
    <main>
        <div class="demo">
            <header>
                <h2>Mi Página Web</h2>
                <form>
                    <label for="busqueda">Buscar:</label>
                    <input type="text" id="busqueda" name="busqueda" placeholder="Escribe aquí...">
                    <input type="submit" value="Buscar">
                </form>
            </header>
        </div>

    </main>
</body>
</html>
