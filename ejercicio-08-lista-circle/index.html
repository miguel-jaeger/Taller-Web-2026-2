<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

<body>
    <header class="page-header">
        <h1>Ejercicio 8: Lista desordenada con viñeta circular vacía</h1>
        <p class="consigna">Una lista desordenada con cuatro países de Sudamérica y el atributo <code>type="circle"</code> para mostrar círculos sin relleno.</p>
    </header>
    <main>
        <div class="demo">
            <ul type="circle">
                <li>Perú</li>
                <li>Argentina</li>
                <li>Brasil</li>
                <li>Colombia</li>
            </ul>
        </div>

    </main>
