<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Fusión de filas verticales</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 4: Fusión de filas verticales</h1>
        <p class="consigna">Una tabla de turnos de dos docentes; la columna «Área» usa <code>rowspan="2"</code> para abarcar dos filas.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <tr>
                    <th>Área</th>
                    <th>Docente</th>
                    <th>Turno</th>
                </tr>
                <tr>
                    <td rowspan="2">Sistemas</td>
                    <td>Carlos Mendoza</td>
                    <td>Mañana</td>
                </tr>
                <tr>
                    <td>Lucía Paredes</td>
                    <td>Noche</td>
                </tr>
            </table>

        </section>

    </main>
</body>
</html>
