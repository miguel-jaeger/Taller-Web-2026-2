<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Encabezados y título descriptivo</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 2: Encabezados y título descriptivo</h1>
        <p class="consigna">Una tabla con título mediante <code>&lt;caption&gt;</code>, fila de encabezados con <code>&lt;th&gt;</code> y al menos una fila de datos.</p>
    </header>
    <main>
        <section class="demo">
            <table border="1">
                <caption>Registro de Asistencia</caption>
                <tr>
                    <th>Código</th>
                    <th>Estudiante</th>
                    <th>Condición</th>
                </tr>
                <tr>
                    <td>U202301</td>
                    <td>Ana Torres</td>
                    <td>Presente</td>
                </tr>
            </table>

        </section>

    </main>
</body>
</html>
