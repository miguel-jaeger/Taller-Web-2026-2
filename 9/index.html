<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería responsiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Galería responsiva</h1>
        <p>Las fotos ocupan el 25% del ancho en cuatro columnas y pasan a ocupar el 100% en pantallas pequeñas.</p>

        <section class="galeria" aria-label="Galería de fotos">
            <figure class="item-foto">
                <img src="https://picsum.photos/id/1015/600/400" alt="Río entre montañas" width="600" height="400">
                <figcaption>Río entre montañas</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1016/600/400" alt="Sendero entre árboles" width="600" height="400">
                <figcaption>Sendero entre árboles</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1018/600/400" alt="Paisaje montañoso junto a un lago" width="600" height="400">
                <figcaption>Paisaje montañoso junto a un lago</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1019/600/400" alt="Costa rocosa al atardecer" width="600" height="400">
                <figcaption>Costa rocosa al atardecer</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1024/600/400" alt="Ciervo en el bosque" width="600" height="400">
                <figcaption>Ciervo en el bosque</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1036/600/400" alt="Cascada entre rocas" width="600" height="400">
                <figcaption>Cascada entre rocas</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1043/600/400" alt="Bosque de secuoyas" width="600" height="400">
                <figcaption>Bosque de secuoyas</figcaption>
            </figure>

            <figure class="item-foto">
                <img src="https://picsum.photos/id/1050/600/400" alt="Montañas nevadas" width="600" height="400">
                <figcaption>Montañas nevadas</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
