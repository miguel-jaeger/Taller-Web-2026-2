<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9: Eventos del mouse</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 9: Eventos del mouse</h1>
        <p class="consigna">Un párrafo que cambia el color del texto a azul con <code>onmouseover</code> y regresa a negro con <code>onmouseout</code>.</p>
    </header>
    <main>
        <section class="demo">
            <p onmouseover="this.style.color='blue'"
               onmouseout="this.style.color='black'">
                Pasa el mouse por aquí
            </p>

        </section>

    </main>
</body>
</html>
