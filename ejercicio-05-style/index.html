<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 · Alteración de estilos con .style</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicio 5: Alteración directa de estilos CSS</h1>
        <p class="consigna">
            Al presionar el botón, modifica el color de fondo de la caja a <code>orchid</code> (<code>backgroundColor</code>) y redondea sus esquinas al 50% (<code>borderRadius</code>) mediante la propiedad <code>.style</code>.
        </p>
    </header>

    <div class="panel">
        <button id="btnTransformar" type="button">Transformar Caja</button>
        <div class="caja"></div>
    </div>

    <p class="nota">
        La caja mide 100 × 100 píxeles y parte con fondo <code>lightblue</code>.
    </p>

    <script src="script.js"></script>
</body>
</html>
