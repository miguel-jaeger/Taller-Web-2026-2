<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5: Agrupación de campos con &lt;fieldset&gt; y &lt;legend&gt;</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 5: Agrupación de campos con &lt;fieldset&gt; y &lt;legend&gt;</h1>
        <p class="consigna">Dos campos de texto, «Nombre» y «Dirección», dentro de un grupo visual titulado «Información personal».</p>
    </header>
    <main>
        <div class="demo">
            <form>
                <fieldset>
                    <legend>Información personal</legend>
                    <label for="nombre5">Nombre:</label><br>
                    <input type="text" id="nombre5" name="nombre"><br><br>
                    <label for="direccion5">Dirección:</label><br>
                    <input type="text" id="direccion5" name="direccion"><br>
                </fieldset>
            </form>
        </div>

    </main>
</body>
</html>
