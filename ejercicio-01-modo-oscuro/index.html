<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Modo oscuro persistente</title>
    <link rel="stylesheet" href="../assets/estilos.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 1: Modo oscuro persistente</h1>
        <p class="consigna">Un botón alterna entre tema claro y oscuro. La preferencia se guarda en <code>localStorage</code> y se recupera al recargar la página.</p>
    </header>
    <main>
        <section class="demo">
            <h2>Preferencia de tema</h2>
            <p>El tema seleccionado se conserva aunque recargues la página.</p>
            <button id="themeToggle" type="button" aria-pressed="false">Activar modo oscuro</button>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
