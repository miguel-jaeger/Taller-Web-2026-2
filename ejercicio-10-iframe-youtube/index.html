<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10: Video incrustado de YouTube mediante &lt;iframe&gt;</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 10: Video incrustado de YouTube mediante &lt;iframe&gt;</h1>
        <p class="consigna">Un reproductor de YouTube incrustado con 560 píxeles de ancho, 315 de alto y el atributo <code>allowfullscreen</code>.</p>
    </header>
    <main>
        <div class="demo">
            <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/MNKSgamtPIs"
                    frameborder="0"
                    allowfullscreen></iframe>
        </div>

    </main>
</body>
