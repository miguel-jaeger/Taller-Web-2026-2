<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 · Condicional if / else</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicio 1: Evaluación condicional básica</h1>
        <p class="consigna">
            Ingresa una edad y muestra en consola si la persona es mayor o menor de edad.
        </p>
    </header>

    <form id="form-edad">
        <div class="campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" value="18" min="0" max="120" required>
             <input type="number" id="edad1" name="edad1" value="18" min="0" max="120" required>
        </div>
        <button type="submit">Evaluar edad</button>
    </form>

    <p class="nota">
        Abre la consola del navegador (<code>F12</code> → pestaña «Consola») para ver el resultado.
    </p>

    <script src="script.js"></script>
</body>
</html>
