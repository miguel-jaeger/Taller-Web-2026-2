<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8: Detección de cambios en listas desplegables</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 8: Detección de cambios en listas desplegables</h1>
        <p class="consigna">Un menú <code>&lt;select&gt;</code> con Perú, Chile y Argentina que muestra una alerta con el valor seleccionado al cambiar de opción.</p>
    </header>
    <main>
        <section class="demo">
            <select onchange="alert('Seleccionaste: ' + this.value)">
                <option value="Perú">Perú</option>
                <option value="Chile">Chile</option>
                <option value="Argentina">Argentina</option>
            </select>

        </section>

    </main>
</body>
</html>
