<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9: Reproductor de video local</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 9: Reproductor de video local</h1>
        <p class="consigna">Un video local de 640 × 360 píxeles con controles activos y un mensaje alternativo. Como el archivo <code>videos/VIDEO.MP4</code> no está incluido, se usa un video público de ejemplo.</p>
    </header>
    <main>
        <div class="demo">
            <video width="640" height="360" controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                <p>Tu navegador no admite la etiqueta de video.</p>
            </video>
        </div>

    </main>
</body>
</html>
