<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Campo multilínea &lt;textarea&gt;</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 2: Campo multilínea &lt;textarea&gt;</h1>
        <p class="consigna">Una caja de texto de varias líneas configurada con 5 filas, 40 columnas y el texto de guía «Escribe tu mensaje aquí...».</p>
    </header>
    <main>
        <div class="demo">
            <form>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="msj" rows="5" cols="40" placeholder="Escribe tu mensaje aquí..."></textarea>
            </form>
        </div>

    </main>
</body>
</html>
