<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 · Ventana de confirmación</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicio 8: Ventana de confirmación booleana</h1>
        <p class="consigna">
            Solicita una confirmación con <code>window.confirm('¿Estás seguro?')</code>.
            Si el usuario acepta, muestra «Está bien, sí estás seguro.»; si cancela,
            muestra «Pareces indeciso».
        </p>
    </header>

    <p class="nota">Al cargar la página aparecerá la ventana de confirmación.</p>

    <script src="script.js"></script>
</body>
</html>
