<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 · Eliminación de elementos con remove</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicio 7: Eliminación directa de elementos del DOM</h1>
        <p class="consigna">
            Al hacer clic en el botón «Eliminar Banner», remueve por completo el banner de la página usando el método <code>.remove()</code>.
        </p>
    </header>

    <div class="panel">
        <div id="banner" class="banner">
            Este es un banner que será eliminado
        </div>
        <button id="btnEliminar" type="button">Eliminar Banner</button>
    </div>

    <p class="nota">
        Una vez eliminado, el banner deja de existir en el DOM y el botón se deshabilita.
    </p>

    <script src="script.js"></script>
</body>
</html>
