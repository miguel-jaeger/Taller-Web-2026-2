<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6: Lista de tareas dinámica</title>
    <link rel="stylesheet" href="../assets/estilos.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 6: Lista de tareas dinámica</h1>
        <p class="consigna">Una lista que permite agregar tareas, marcarlas como completadas y eliminarlas. El contador y los elementos se actualizan dinámicamente.</p>
    </header>
    <main>
        <section class="demo">
            <div class="entrada">
                <input type="text" id="nuevaTarea" placeholder="Escribe una tarea..." aria-label="Nueva tarea">
                <button id="agregar" type="button">Agregar</button>
            </div>
            <ul id="tareas"></ul>
            <div class="acciones">
                <span id="contador">0 tareas</span>
            </div>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
