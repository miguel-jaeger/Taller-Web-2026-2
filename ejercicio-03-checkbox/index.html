<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Selección múltiple con casillas de verificación</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 3: Selección múltiple con casillas de verificación</h1>
        <p class="consigna">Un grupo de <code>checkbox</code> para seleccionar pasatiempos: Arte, Televisión, Video juegos y Deporte.</p>
    </header>
    <main>
        <div class="demo">
            <form>
                <p>Preferencias:</p>
                <label><input type="checkbox" name="arte"> Arte</label><br>
                <label><input type="checkbox" name="television"> Televisión</label><br>
                <label><input type="checkbox" name="videojuegos"> Video juegos</label><br>
                <label><input type="checkbox" name="deportes"> Deporte</label>
            </form>
        </div>

    </main>
</body>
</html>
