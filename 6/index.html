<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes responsivas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Imágenes responsivas</h1>
        <p>La imagen se adapta al ancho de su contenedor sin perder su proporción.</p>

        <figure>
            <img
                src="https://picsum.photos/id/1018/1200/800"
                alt="Paisaje montañoso junto a un lago"
                width="1200"
                height="800"
            >
            <figcaption>Al reducir el ancho de la ventana, la imagen escala sin deformarse.</figcaption>
        </figure>
    </main>
</body>
</html>
