<body>
    <header>
        <h1>Ejercicio 5: Manipulación dinámica de arreglos</h1>
        <p class="consigna">
            Crea el arreglo <code>frutas</code> con «manzana», «banana» y «naranja».
            Agrega «uva» con <code>.push()</code> e imprime la cantidad total de elementos
            con <code>.length</code>.

    <p class="nota">
        Abre la consola del navegador (<code>F12</code> → pestaña «Consola») para ver el resultado.
    </p>
