<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8: Reproductor de audio local</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header class="page-header">
        <h1>Ejercicio 8: Reproductor de audio local</h1>
        <p class="consigna">Un reproductor de audio con controles visibles, precarga desactivada. Como el archivo <code>Mozart.mp4</code> no está incluido, se usa un audio público de ejemplo.</p>
    </header>
    <main>
        <div class="demo">
            <audio controls preload="none">
                <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                Tu navegador no admite el elemento de audio.
            </audio>
        </div>

    </main>
</body>
</html>
